<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051d" />
      <stop offset="50%" stop-color="#150a38" />
      <stop offset="100%" stop-color="#050212" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b123d" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0e0722" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad3)" />
  
  <!-- Glowing orbs -->
  <circle cx="240" cy="180" r="150" fill="#8b5cf6" opacity="0.18" filter="url(#glow3)" />
  <circle cx="620" cy="340" r="160" fill="#ec4899" opacity="0.14" filter="url(#glow3)" />

  <!-- App Window -->
  <rect x="60" y="45" width="680" height="410" rx="16" fill="url(#cardGrad3)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="60" y="45" width="680" height="45" rx="16" fill="rgba(255,255,255,0.03)" />
  <circle cx="85" cy="68" r="6" fill="#ef4444" />
  <circle cx="105" cy="68" r="6" fill="#f59e0b" />
  <circle cx="125" cy="68" r="6" fill="#10b981" />
  <text x="400" y="73" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="500">Yasith Umesha — Developer Portfolio</text>

  <!-- Hero Preview Container inside mock -->
  <g transform="translate(100, 110)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.4)" />
    <circle cx="14" cy="13" r="4" fill="#10b981" />
    <text x="95" y="17" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="500">Full-Stack Developer</text>

    <!-- Main Title -->
    <text x="0" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Hi, I'm Yasith Umesha</text>
    <text x="0" y="98" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="20" font-weight="600">Information Systems Undergraduate</text>
    
    <text x="0" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Designing &amp; building fast, responsive, and reliable web applications.</text>

    <!-- Buttons -->
    <rect x="0" y="160" width="130" height="38" rx="8" fill="url(#purpleGrad)" />
    <text x="65" y="184" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">View Projects ➔</text>

    <rect x="145" y="160" width="115" height="38" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
    <text x="202" y="184" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Contact Me</text>
  </g>

  <!-- Floating Tech Stack Window -->
  <g transform="translate(450, 120)">
    <rect width="250" height="230" rx="12" fill="#090518" stroke="rgba(139, 92, 246, 0.3)" />
    <!-- Mini header -->
    <rect width="250" height="30" rx="12" fill="rgba(255,255,255,0.04)" />
    <text x="20" y="20" fill="#a5b4fc" font-family="monospace" font-size="11">yasith.config.ts</text>

    <text x="20" y="60" fill="#f472b6" font-family="monospace" font-size="11">const <tspan fill="#60a5fa">developer</tspan> = {</text>
    <text x="35" y="82" fill="#94a3b8" font-family="monospace" font-size="11">name: <tspan fill="#34d399">"Yasith Umesha"</tspan>,</text>
    <text x="35" y="104" fill="#94a3b8" font-family="monospace" font-size="11">role: <tspan fill="#34d399">"Full-Stack Dev"</tspan>,</text>
    <text x="35" y="126" fill="#94a3b8" font-family="monospace" font-size="11">university: <tspan fill="#34d399">"SUSL"</tspan>,</text>
    <text x="35" y="148" fill="#94a3b8" font-family="monospace" font-size="11">stack: [<tspan fill="#facc15">"Next.js"</tspan>, <tspan fill="#facc15">"React"</tspan>],</text>
    <text x="35" y="170" fill="#94a3b8" font-family="monospace" font-size="11">openToWork: <tspan fill="#60a5fa">true</tspan></text>
    <text x="20" y="195" fill="#f472b6" font-family="monospace" font-size="11">};</text>
  </g>

  <!-- Bottom Metric Pills -->
  <g transform="translate(100, 350)">
    <rect x="0" y="0" width="170" height="55" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <text x="20" y="25" fill="#818cf8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Next.js 16</text>
    <text x="20" y="43" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">App Router Architecture</text>

    <rect x="185" y="0" width="170" height="55" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <text x="205" y="25" fill="#c084fc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Tailwind CSS</text>
    <text x="205" y="43" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Modern Responsive UI</text>

    <rect x="370" y="0" width="170" height="55" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <text x="390" y="25" fill="#f472b6" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Framer Motion</text>
    <text x="390" y="43" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Polished Animations</text>
  </g>
</svg>

