<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c1e" />
      <stop offset="50%" stop-color="#0a1738" />
      <stop offset="100%" stop-color="#030814" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1f3d" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#081429" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad2)" />
  
  <!-- Glowing orbs -->
  <circle cx="200" cy="380" r="150" fill="#06b6d4" opacity="0.12" filter="url(#glow2)" />
  <circle cx="680" cy="120" r="160" fill="#3b82f6" opacity="0.16" filter="url(#glow2)" />

  <!-- App Window -->
  <rect x="60" y="45" width="680" height="410" rx="16" fill="url(#cardGrad2)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="60" y="45" width="680" height="45" rx="16" fill="rgba(255,255,255,0.03)" />
  <circle cx="85" cy="68" r="6" fill="#ef4444" />
  <circle cx="105" cy="68" r="6" fill="#f59e0b" />
  <circle cx="125" cy="68" r="6" fill="#10b981" />
  <text x="400" y="73" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="500">SmartRent — Property Rental &amp; Management</text>

  <!-- Search / Filter Bar -->
  <rect x="90" y="105" width="620" height="46" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
  <text x="115" y="133" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">🔍 Search location, price, or apartment type...</text>
  <rect x="580" y="113" width="115" height="30" rx="6" fill="url(#tealGrad)" />
  <text x="637" y="132" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Find Rent</text>

  <!-- Property Cards Grid -->
  <!-- Card 1 -->
  <rect x="90" y="170" width="295" height="255" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(6, 182, 212, 0.25)" />
  <!-- Image Banner -->
  <rect x="100" y="180" width="275" height="120" rx="8" fill="#112240" />
  <!-- House illustration -->
  <path d="M237 205 L170 255 L305 255 Z" fill="#06b6d4" opacity="0.6" />
  <rect x="195" y="255" width="85" height="35" fill="#1e3a6d" />
  <rect x="225" y="265" width="25" height="25" fill="#38bdf8" opacity="0.8" />
  <rect x="110" y="190" width="70" height="22" rx="4" fill="#06b6d4" />
  <text x="145" y="205" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">AVAILABLE</text>

  <text x="110" y="325" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Modern Urban Studio</text>
  <text x="110" y="345" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Colombo City • 2 Bed • 1 Bath</text>
  <text x="110" y="380" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="700">$450 <tspan fill="#64748b" font-size="11" font-weight="400">/month</tspan></text>
  <rect x="270" y="360" width="105" height="30" rx="6" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" />
  <text x="322" y="380" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Book Tour</text>

  <!-- Card 2 -->
  <rect x="415" y="170" width="295" height="255" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(59, 130, 246, 0.25)" />
  <!-- Image Banner -->
  <rect x="425" y="180" width="275" height="120" rx="8" fill="#112240" />
  <path d="M562 205 L495 255 L630 255 Z" fill="#3b82f6" opacity="0.6" />
  <rect x="520" y="255" width="85" height="35" fill="#1e3a6d" />
  <rect x="550" y="265" width="25" height="25" fill="#60a5fa" opacity="0.8" />
  <rect x="435" y="190" width="70" height="22" rx="4" fill="#3b82f6" />
  <text x="470" y="205" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">VERIFIED</text>

  <text x="435" y="325" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Luxury Seaside Residence</text>
  <text x="435" y="345" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Galle Coast • 3 Bed • 2 Bath</text>
  <text x="435" y="380" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="16" font-weight="700">$780 <tspan fill="#64748b" font-size="11" font-weight="400">/month</tspan></text>
  <rect x="595" y="360" width="105" height="30" rx="6" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" />
  <text x="647" y="380" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Book Tour</text>
</svg>

