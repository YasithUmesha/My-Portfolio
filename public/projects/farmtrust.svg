  <text x="415" y="414" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle">MongoDB</text>
  <rect x="465" y="400" width="80" height="22" rx="4" fill="#061015" stroke="#fb923c" stroke-opacity="0.3" stroke-width="1"/>
  <text x="505" y="414" font-family="monospace" font-size="9" fill="#fb923c" text-anchor="middle">Express</text>
  <defs>
