  <!-- Leaf shape -->
  <path d="M400 170 C430 185 450 210 400 265 C350 210 370 185 400 170Z" fill="#10b981" fill-opacity="0.6"/>
  <line x1="400" y1="265" x2="400" y2="195" stroke="#06080e" stroke-width="2"/>
