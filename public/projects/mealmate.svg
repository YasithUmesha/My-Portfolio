<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a24" />
      <stop offset="50%" stop-color="#13103a" />
      <stop offset="100%" stop-color="#070617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f0c29" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  
  <!-- Glowing orbs -->
  <circle cx="200" cy="150" r="140" fill="#f59e0b" opacity="0.12" filter="url(#glow)" />
  <circle cx="650" cy="350" r="160" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

  <!-- App Window Container -->
  <rect x="60" y="45" width="680" height="410" rx="16" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="60" y="45" width="680" height="45" rx="16" fill="rgba(255,255,255,0.03)" />
  <circle cx="85" cy="68" r="6" fill="#ef4444" />
  <circle cx="105" cy="68" r="6" fill="#f59e0b" />
  <circle cx="125" cy="68" r="6" fill="#10b981" />
  <text x="400" y="73" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="500">MealMate — Smart Meal Planner</text>

  <!-- Left Sidebar Mockup -->
  <rect x="85" y="110" width="160" height="320" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" />
  <rect x="105" y="130" width="120" height="20" rx="5" fill="url(#primaryGrad)" opacity="0.8" />
  <rect x="105" y="165" width="90" height="10" rx="3" fill="rgba(255,255,255,0.2)" />
  <rect x="105" y="190" width="110" height="10" rx="3" fill="rgba(255,255,255,0.15)" />
  <rect x="105" y="215" width="80" height="10" rx="3" fill="rgba(255,255,255,0.15)" />
  <rect x="105" y="240" width="100" height="10" rx="3" fill="rgba(255,255,255,0.15)" />
  
  <rect x="105" y="360" width="120" height="50" rx="8" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.3)" />
  <text x="165" y="390" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Weekly Goal: 85%</text>

  <!-- Main Content Area: Meal Cards -->
  <!-- Header Bar -->
  <rect x="270" y="110" width="445" height="40" rx="8" fill="rgba(255,255,255,0.03)" />
  <text x="290" y="135" fill="#f8faff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Today's Nutrition &amp; Recipes</text>

  <!-- Card 1: Breakfast -->
  <rect x="270" y="165" width="210" height="120" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(245, 158, 11, 0.3)" />
  <circle cx="310" cy="205" r="22" fill="url(#primaryGrad)" opacity="0.8" />
  <text x="310" y="211" font-size="18" text-anchor="middle">🥑</text>
  <text x="345" y="200" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Avocado Bowl</text>
  <text x="345" y="218" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="11">420 kcal • 15g Protein</text>
  <rect x="290" y="245" width="170" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
  <rect x="290" y="245" width="120" height="6" rx="3" fill="#f59e0b" />

  <!-- Card 2: Lunch -->
  <rect x="500" y="165" width="215" height="120" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(99, 102, 241, 0.3)" />
  <circle cx="540" cy="205" r="22" fill="url(#accentGrad)" opacity="0.8" />
  <text x="540" y="211" font-size="18" text-anchor="middle">🥗</text>
  <text x="575" y="200" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Mediterranean</text>
  <text x="575" y="218" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="11">560 kcal • 28g Protein</text>
  <rect x="520" y="245" width="175" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
  <rect x="520" y="245" width="145" height="6" rx="3" fill="#6366f1" />

  <!-- Lower Stats Banner -->
  <rect x="270" y="305" width="445" height="125" rx="12" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(168, 85, 247, 0.25)" />
  <text x="295" y="335" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Daily Calorie &amp; Macro Breakdown</text>
  <rect x="295" y="355" width="180" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
  <rect x="295" y="355" width="140" height="8" rx="4" fill="url(#primaryGrad)" />
  <rect x="295" y="375" width="180" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
  <rect x="295" y="375" width="110" height="8" rx="4" fill="url(#accentGrad)" />
  <text x="295" y="410" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Carbs: 180g | Protein: 95g | Fats: 45g</text>

  <!-- Floating Badge -->
  <g transform="translate(560, 335)">
    <rect width="135" height="65" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" />
    <text x="67" y="26" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="500">API Status</text>
    <circle cx="45" cy="45" r="4" fill="#10b981" />
    <text x="75" y="49" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Connected</text>
  </g>
</svg>

